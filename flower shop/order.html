<!DOCTYPE html>
<html>

<head>

    <title>Order Flowers</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>



<nav>

    <a href="index.html">Home</a>

    <a href="flowers.html">Flowers</a>

    <a href="order.html">Order</a>

</nav>


<header>

    <h1>Order Your Flowers</h1>

    <p>Fill the form to place your order.</p>

</header>



<section>

    <h2>Order Form</h2>


    <form>


        <label>Name:</label>

        <input type="text" placeholder="Enter your name">


        <label>Email:</label>

        <input type="text" placeholder="Enter your email">


        <label>Gender:</label>

        <input type="radio" name="gender"> Male

        <input type="radio" name="gender"> Female


        <label>Select Flower:</label>

        <select>

            <option>Select Flower</option>

            <option>Roses</option>

            <option>Tulips</option>

            <option>Sunflowers</option>

        </select>


        <label>Extra Options:</label>

        <input type="checkbox"> Gift Wrapping

        <input type="checkbox"> Greeting Card


        <br><br>


        <input type="submit" value="Place Order">

        <input type="reset" value="Reset">


    </form>

</section>


<footer>

    <p>© 2026 Bloom Flower Shop</p>

</footer>


</body>

</html>
